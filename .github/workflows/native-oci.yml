# Execution stays disabled until the operator records Blacksmith qualification.
# See https://github.com/spitzli/cloud/blob/main/tools/plugin-ci/BLACKSMITH.md; runner labels alone do not select a region.
# Specialized/native processes without a reviewed extension authoring manifest.
# This publishes OCI metadata only. It never claims Tabularium extension admission.
name: Native OCI plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-oci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: vars.SPITZLI_BLACKSMITH_READY == 'true' && vars.SPITZLI_BLACKSMITH_REGION != '' && vars.SPITZLI_BLACKSMITH_BUILDER_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      SPITZLI_OCI_BACKEND: blacksmith-buildx
      SPITZLI_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
    steps:
      - name: Require reviewed Blacksmith execution
        shell: bash
        env:
          QUALIFIED_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
        run: |
          set -euo pipefail
          case "${BLACKSMITH_REGION:-}" in us-east|us-west|eu-central|eu-west) ;; *) echo 'Recorded Blacksmith region required' >&2; exit 1 ;; esac
          test "$BLACKSMITH_REGION" = "$QUALIFIED_BLACKSMITH_REGION"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject unexpected existing BuildKit before provider setup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e buildkitd.toml
          python3 scripts/plugin-release/build_oci.py --before-blacksmith-setup
      - name: Set up the managed Blacksmith builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # reviewed v2
        with:
          cache-key: Dockerfile
          nofallback: true
          buildx-version: v0.23.0
          platforms: linux/amd64
      - name: Verify provider builder and keep generated configuration outside source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plugin-release/build_oci.py --assert-blacksmith-builder
          mv -- buildkitd.toml "$RUNNER_TEMP/blacksmith-buildkitd.toml"
      - run: python3 scripts/native-release.py check
      - name: Run independent locked checks in the qualified qualified Blacksmith builder
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/plugin-release/build_oci.py --check </dev/null
  release:
    needs: check
    if: vars.SPITZLI_BLACKSMITH_READY == 'true' && vars.SPITZLI_BLACKSMITH_REGION != '' && vars.SPITZLI_BLACKSMITH_BUILDER_READY == 'true' && (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: plugin-release
    permissions:
      contents: write
      packages: write
    env:
      SPITZLI_OCI_BACKEND: blacksmith-buildx
      SPITZLI_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
    steps:
      - name: Require reviewed Blacksmith execution
        shell: bash
        env:
          QUALIFIED_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
        run: |
          set -euo pipefail
          case "${BLACKSMITH_REGION:-}" in us-east|us-west|eu-central|eu-west) ;; *) echo 'Recorded Blacksmith region required' >&2; exit 1 ;; esac
          test "$BLACKSMITH_REGION" = "$QUALIFIED_BLACKSMITH_REGION"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject unexpected existing BuildKit before provider setup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e buildkitd.toml
          python3 scripts/plugin-release/build_oci.py --before-blacksmith-setup
      - name: Set up the managed Blacksmith builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # reviewed v2
        with:
          cache-key: Dockerfile
          nofallback: true
          buildx-version: v0.23.0
          platforms: linux/amd64
      - name: Verify provider builder and keep generated configuration outside source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plugin-release/build_oci.py --assert-blacksmith-builder
          mv -- buildkitd.toml "$RUNNER_TEMP/blacksmith-buildkitd.toml"
      - run: python3 scripts/native-release.py check
      - name: Resolve repository image and require exact release tag
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json,os; m=json.load(open("standalone.json")); assert os.environ["GITHUB_REF_NAME"] == "v"+m["release"]["version"], "Tag/version mismatch"'
          printf 'IMAGE_REPOSITORY=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push through the qualified qualified Blacksmith builder
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | python3 scripts/plugin-release/build_oci.py
      - name: Bind OCI metadata to actual image and source; do not mint protocol descriptors
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native-release.py finalize --image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Publish immutable native OCI metadata only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/native-release.json --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
